x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:latest
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN_NAME}`)"
        - "traefik.http.routers.prometheus.entrypoints=websecure"
        - "traefik.http.routers.prometheus.middlewares=authentik@docker"
        - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
        - "traefik.http.routers.prometheus.tls=true"
        - "homepage.group=Monitoring"
        - "homepage.name=Prometheus"
        - "homepage.icon=prometheus.png"
        - "homepage.href=https://prometheus.${DOMAIN_NAME}"
        - "homepage.description=Time-Series Metrics"
    networks:
      internal:
      aether-net:
        aliases:
          - prometheus

  grafana:
    image: grafana/grafana:latest
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    volumes:
      - grafana_data:/var/lib/grafana
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yaml
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN_NAME}
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Authentik
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=grafana
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET__FILE=/run/secrets/argus_grafana_oidc_secret
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email groups
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://id.${DOMAIN_NAME}/application/o/authorize/
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://id.${DOMAIN_NAME}/application/o/token/
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://id.${DOMAIN_NAME}/application/o/userinfo/
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(groups[*], 'admins') && 'Admin' || 'Viewer'
    secrets:
      - argus_grafana_oidc_secret
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN_NAME}`)"
        - "traefik.http.routers.grafana.entrypoints=websecure"
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"
        - "traefik.http.routers.grafana.tls=true"
        - "homepage.group=Monitoring"
        - "homepage.name=Grafana"
        - "homepage.icon=grafana.png"
        - "homepage.href=https://grafana.${DOMAIN_NAME}"
        - "homepage.description=Metrics & Dashboards"
    networks:
      - internal
      - aether-net

  node-exporter:
    image: prom/node-exporter:latest
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - target: 9100
        published: 9100
        mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9100/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    deploy:
      mode: global
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - internal

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    environment:
      - GOMEMLIMIT=450MiB
    command:
      - --housekeeping_interval=15s
      - --docker_only=true
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp,disk,diskIO
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    deploy:
      mode: global
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - internal

volumes:
  prometheus_data:
  grafana_data:

secrets:
  argus_grafana_oidc_secret:
    external: true
    name: ${OIDC_GRAFANA_CLIENT_SECRET_NAME}

networks:
  aether-net:
    external: true
  internal:
    driver: overlay
    attachable: true

configs:
  prometheus_config:
    file: ./configs/prometheus/prometheus.yml
  grafana_datasource:
    file: ./configs/grafana/datasources/prometheus.yaml
