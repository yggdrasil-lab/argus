global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['192.168.86.166:9100']
        labels:
          instance: 'gaia'
          nodename: 'gaia'
      - targets: ['192.168.86.167:9100']
        labels:
          instance: 'muspelheim'
          nodename: 'muspelheim'

  - job_name: 'cadvisor'
    dns_sd_configs:
      - names:
          - 'tasks.cadvisor'
        type: 'A'
        port: 8080

  - job_name: 'traefik'
    static_configs:
      - targets: ['tasks.olympus_traefik:8082']
